

server.port=8080



spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/techstore}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin123}
spring.datasource.driver-class-name=org.postgresql.Driver




spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


app.jwt.secret=${JWT_SECRET:TechStoreChile2024SecretKeyJWTSigningAlgorithmHS256Segura}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}


app.security.username=${APP_SECURITY_USERNAME:admin@techstore.cl}
app.security.password=${APP_SECURITY_PASSWORD:Admin1234}


app.aws.region=${AWS_REGION:us-east-1}
app.aws.sqs.queue-url=${SQS_QUEUE_URL:}